<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đăng nhập</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<h1>Đăng nhập</h1>
<div id="success-message" class="success" th:if="${success}" th:text="${success}"></div>
<div id="error-message" class="error" th:if="${error}" th:text="${error}"></div>
<form method="post" th:action="@{/login}">
  <div><label for="username">Username</label><input type="text" id="username" name="username"></div>
  <div><label for="password">Mật khẩu</label><input type="password" id="password" name="password"></div>
  <button type="submit" id="btn-login">Đăng nhập</button>
</form>
<p>Chưa có tài khoản? <a id="link-register" th:href="@{/register}">Đăng ký</a></p>
</body></html>
