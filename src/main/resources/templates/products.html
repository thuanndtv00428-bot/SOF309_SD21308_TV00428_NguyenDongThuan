<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Sản phẩm</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<h1>Danh sách sản phẩm</h1>
<nav><a th:href="@{/home}">Trang chủ</a><a th:href="@{/logout}">Đăng xuất</a></nav>
<div id="success-message" class="success" th:if="${success}" th:text="${success}"></div>
<div id="error-message" class="error" th:if="${error}" th:text="${error}"></div>
<a id="btn-add" class="btn" th:href="@{/products/new}">+ Thêm sản phẩm</a>
<table id="product-table">
  <thead><tr><th>ID</th><th>Tên sản phẩm</th><th>Giá bán</th><th>Số lượng</th><th>Thao tác</th></tr></thead>
  <tbody>
    <tr th:each="p : ${products}">
      <td th:text="${p.id}"></td>
      <td class="p-name" th:text="${p.name}"></td>
      <td th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')}"></td>
      <td th:text="${p.quantity}"></td>
      <td>
        <a class="btn btn-edit" th:href="@{/products/{id}/edit(id=${p.id})}">Sửa</a>
        <form style="display:inline" method="post" th:action="@{/products/{id}/delete(id=${p.id})}"
              onsubmit="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">
          <button type="submit" class="btn-danger btn-delete">Xóa</button>
        </form>
      </td>
    </tr>
  </tbody>
</table>
</body></html>
